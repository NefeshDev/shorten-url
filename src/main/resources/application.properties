spring.application.name=short-url
spring.datasource.driver-class-name=org.postgresql.Driver

# 1. Troque o link antigo pelo NOVO link do Connection Pooler (geralmente tem a porta 6543)
# Não esqueça de colocar o jdbc:postgresql:// no começo e o ?sslmode=require no final
spring.datasource.url=jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:6543/postgres?sslmode=require

# 2. Atualize o seu username (o Supabase vai te dar ele na mesma tela)
spring.datasource.username=postgres.nsakbrzridsamasusdro

# 3. A senha continua vindo do seu .env
spring.datasource.password=${DB_PASSWORD}

# O resto continua igual
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
